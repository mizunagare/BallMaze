<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" font-family="'Segoe UI',Arial,'Microsoft YaHei',sans-serif">
  <rect x="0" y="0" width="680" height="460" fill="#f4f7fb"/>
  <text x="340" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#1a2b4a">万象归途 · 统一可玩候选完整循环</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#5a6b85">integration/cp06-playable-candidate · 基线 e93d6eeb</text>

  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#3a4a63"/>
    </marker>
  </defs>

  <!-- edges -->
  <g stroke="#3a4a63" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="138" y1="110" x2="152" y2="110"/>
    <line x1="268" y1="110" x2="282" y2="110"/>
    <line x1="398" y1="110" x2="412" y2="110"/>
    <line x1="528" y1="110" x2="542" y2="110"/>
    <line x1="600" y1="134" x2="600" y2="276"/>
    <line x1="542" y1="300" x2="528" y2="300"/>
    <line x1="412" y1="300" x2="398" y2="300"/>
    <line x1="282" y1="300" x2="268" y2="300"/>
    <!-- return S9 -> S1 (curved) -->
    <path d="M210,276 C150,240 150,150 138,134" marker-end="url(#arr)"/>
  </g>

  <!-- nodes -->
  <g font-size="14" font-weight="600" text-anchor="middle">
    <g><rect x="22" y="86" width="116" height="48" rx="10" fill="#2c5282"/><text x="80" y="115" fill="#ffffff">①营地准备</text></g>
    <g><rect x="152" y="86" width="116" height="48" rx="10" fill="#2c5282"/><text x="210" y="115" fill="#ffffff">②出征</text></g>
    <g><rect x="282" y="86" width="116" height="48" rx="10" fill="#2c5282"/><text x="340" y="115" fill="#ffffff">③探索</text></g>
    <g><rect x="412" y="86" width="116" height="48" rx="10" fill="#2c5282"/><text x="470" y="115" fill="#ffffff">④战斗</text></g>
    <g><rect x="542" y="86" width="116" height="48" rx="10" fill="#9c4221"/><text x="600" y="115" fill="#ffffff">⑤Boss</text></g>
    <g><rect x="542" y="276" width="116" height="48" rx="10" fill="#2c5282"/><text x="600" y="305" fill="#ffffff">⑥撤离</text></g>
    <g><rect x="412" y="276" width="116" height="48" rx="10" fill="#2c5282"/><text x="470" y="305" fill="#ffffff">⑦结算</text></g>
    <g><rect x="282" y="276" width="116" height="48" rx="10" fill="#2c5282"/><text x="340" y="305" fill="#ffffff">⑧制造</text></g>
    <g><rect x="152" y="276" width="116" height="48" rx="10" fill="#276749"/><text x="210" y="305" fill="#ffffff">⑨再次出征</text></g>
  </g>

  <!-- cross-region callout -->
  <g>
    <rect x="250" y="150" width="240" height="40" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="370" y="167" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2b4a">跨区状态</text>
    <text x="370" y="183" text-anchor="middle" font-size="11" fill="#5a6b85">森林 / 遗迹 / 洞窟 切换保持状态</text>
    <line x1="340" y1="190" x2="340" y2="208" stroke="#3a4a63" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- save recovery callout -->
  <g>
    <rect x="20" y="200" width="190" height="48" rx="8" fill="#ffffff" stroke="#cbd5e0" stroke-width="1.5"/>
    <text x="115" y="218" text-anchor="middle" font-size="12" font-weight="700" fill="#1a2b4a">存档恢复</text>
    <text x="115" y="235" text-anchor="middle" font-size="11" fill="#5a6b85">新进程读档 · 无瞬态残留</text>
    <line x1="115" y1="200" x2="80" y2="158" stroke="#3a4a63" stroke-width="1.5" marker-end="url(#arr)"/>
  </g>

  <!-- center caption -->
  <text x="430" y="200" font-size="12" fill="#7a8aa3" text-anchor="middle">⑨→① 闭环：读档/新出征</text>
  <text x="430" y="218" font-size="11" fill="#9aa7bd" text-anchor="middle">回到营地准备开始新循环</text>

  <!-- legend -->
  <g font-size="11" fill="#5a6b85">
    <text x="22" y="360">图例：</text>
    <rect x="60" y="352" width="14" height="14" rx="3" fill="#2c5282"/><text x="80" y="363">常规阶段</text>
    <rect x="160" y="352" width="14" height="14" rx="3" fill="#9c4221"/><text x="180" y="363">Boss（C2.4 晶脊守望者）</text>
    <rect x="320" y="352" width="14" height="14" rx="3" fill="#276749"/><text x="340" y="363">循环回到起点</text>
  </g>
  <g font-size="11" fill="#5a6b85">
    <text x="22" y="392">重点检查：跨地区状态 · 技能与武器配置 · 奖励与装备成长 · 存档恢复 · 纯发行 Player</text>
    <text x="22" y="412">证据映射见 ACCEPTANCE_MATRIX.md；历史 FAIL / NOT_RUN / INCOMPLETE 原样保留。</text>
  </g>
</svg>
