<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" font-family="Microsoft YaHei, Noto Sans SC, Source Han Sans SC, sans-serif">
  <defs>
    <marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="720" fill="#F7F9FB"/>

  <text x="40" y="46" font-size="24" font-weight="700" fill="#0F172A">UX-PROGRESSION-01 · 阶段路线图</text>
  <text x="40" y="72" font-size="14" fill="#475569">先看懂（P1）→ 再记住（P2）→ 再精通（P3）→ 最后才谈内容（P4，需重新授权）</text>

  <g stroke="#334155" stroke-width="2" fill="none" marker-end="url(#g1)">
    <line x1="90" y1="120" x2="1120" y2="120"/>
  </g>

  <rect x="40" y="96" width="210" height="48" rx="8" fill="#F1F5F9" stroke="#64748B" stroke-width="1.5"/>
  <text x="145" y="118" font-size="16" font-weight="700" fill="#0F172A" text-anchor="middle">P0 设计冻结</text>
  <text x="145" y="136" font-size="11.5" fill="#475569" text-anchor="middle">仅文档 · 本批</text>

  <rect x="270" y="96" width="210" height="48" rx="8" fill="#ECFDF5" stroke="#0F766E" stroke-width="1.8"/>
  <text x="375" y="118" font-size="16" font-weight="700" fill="#0F5F58" text-anchor="middle">P1 信息层</text>
  <text x="375" y="136" font-size="11.5" fill="#115E59" text-anchor="middle">只读 · 零 schema</text>

  <rect x="500" y="96" width="210" height="48" rx="8" fill="#EFF6FF" stroke="#1D4ED8" stroke-width="1.8"/>
  <text x="605" y="118" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">P2 持久化与回执</text>
  <text x="605" y="136" font-size="11.5" fill="#1E40AF" text-anchor="middle">存档修订 · 单独批次</text>

  <rect x="730" y="96" width="210" height="48" rx="8" fill="#FFFBEB" stroke="#B45309" stroke-width="1.8"/>
  <text x="835" y="118" font-size="16" font-weight="700" fill="#92400E" text-anchor="middle">P3 精通与历史</text>
  <text x="835" y="136" font-size="11.5" fill="#92400E" text-anchor="middle">统计 + 展示 · 零数值</text>

  <rect x="960" y="96" width="210" height="48" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.8" stroke-dasharray="6 4"/>
  <text x="1065" y="118" font-size="16" font-weight="700" fill="#991B1B" text-anchor="middle">P4 内容深化</text>
  <text x="1065" y="136" font-size="11.5" fill="#991B1B" text-anchor="middle">不在本授权范围</text>

  <rect x="40" y="164" width="210" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <g font-size="12.5" fill="#0F172A">
    <text x="56" y="190">· 五系统源码审计</text>
    <text x="56" y="214">· 已有 / 缺失 / 待决三栏</text>
    <text x="56" y="238">· 9 张目标卡定义</text>
    <text x="56" y="262">· 15 条决策（含建议）</text>
    <text x="56" y="286">· 三张图 + 验收标准</text>
    <text x="56" y="310">· 复用清单 12 项</text>
  </g>
  <text x="56" y="344" font-size="12" fill="#64748B">产出：A-01～A-08</text>
  <text x="56" y="366" font-size="12" fill="#64748B">风险：设计写成实现</text>
  <text x="56" y="388" font-size="12" fill="#64748B">缓解：全部标注 file:line</text>

  <rect x="270" y="164" width="210" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <g font-size="12.5" fill="#0F172A">
    <text x="286" y="190">· 目标契约求值器</text>
    <text x="286" y="214">· HUD 目标卡 L1/L2/L3</text>
    <text x="286" y="238">· 路线 Top3 卡 + 理由</text>
    <text x="286" y="262">· 结算"下一局三件事"</text>
    <text x="286" y="286">· 3 张地区身份卡</text>
    <text x="286" y="310">· 技能槽取舍条 + 1/2 热键</text>
    <text x="286" y="334">· 铭刻不可逆提示</text>
  </g>
  <text x="286" y="362" font-size="12" fill="#0F766E">产出：B0-01～B0-12</text>
  <text x="286" y="382" font-size="12" fill="#0F766E">　　　B1-01～B1-05</text>
  <text x="286" y="402" font-size="12" fill="#64748B">风险：计数口径写成"当前持有"</text>

  <rect x="500" y="164" width="210" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <g font-size="12.5" fill="#0F172A">
    <text x="516" y="190">· 技能槽预设（7 武器）</text>
    <text x="516" y="214">· 目标完成回执（幂等）</text>
    <text x="516" y="238">· v9 → v10 迁移</text>
    <text x="516" y="262">· 老档默认值 + 回滚</text>
    <text x="516" y="286">· 双进程 / 故障注入</text>
  </g>
  <text x="516" y="318" font-size="12" fill="#1D4ED8">产出：B2-01～B2-05</text>
  <text x="516" y="340" font-size="12" fill="#64748B">前置：D-03 / D-15 拍板</text>
  <text x="516" y="362" font-size="12" fill="#B91C1C">风险：全项目最高（存档）</text>
  <text x="516" y="384" font-size="12" fill="#64748B">缓解：单独分支 + 双向证据</text>

  <rect x="730" y="164" width="210" height="250" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <g font-size="12.5" fill="#0F172A">
    <text x="746" y="190">· 精通 3 地区 × 3 档</text>
    <text x="746" y="214">· 角色页藏品/精通展示</text>
    <text x="746" y="238">· 目标历史统计</text>
    <text x="746" y="262">· 数值快照 diff = 0</text>
  </g>
  <text x="746" y="294" font-size="12" fill="#B45309">产出：B3-01～B3-03</text>
  <text x="746" y="316" font-size="12" fill="#64748B">前置：D-07 / D-14 拍板</text>
  <text x="746" y="338" font-size="12" fill="#64748B">风险：展示膨胀</text>
  <text x="746" y="360" font-size="12" fill="#64748B">缓解：复用角色页现有行</text>

  <rect x="960" y="164" width="210" height="250" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g font-size="12.5" fill="#7F1D1D">
    <text x="976" y="190">· 每武器第 3 技能</text>
    <text x="976" y="214">· 新武器配方</text>
    <text x="976" y="238">· 单件升级 / 重铸</text>
    <text x="976" y="262">· 地区难度档</text>
  </g>
  <text x="976" y="294" font-size="12" fill="#B91C1C">触碰：冷却/伤害/经济/数值</text>
  <text x="976" y="316" font-size="12" fill="#B91C1C">前置：重新授权的新批次</text>
  <text x="976" y="338" font-size="12" fill="#7F1D1D">本设计明确不做</text>

  <rect x="40" y="430" width="210" height="56" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="145" y="452" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">GATE G0</text>
  <text x="145" y="471" font-size="11.5" fill="#475569" text-anchor="middle">A-01～A-08 全绿</text>

  <rect x="270" y="430" width="210" height="56" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="375" y="452" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">GATE G1</text>
  <text x="375" y="471" font-size="11.5" fill="#475569" text-anchor="middle">B0 + B1；保护文件 diff=0</text>

  <rect x="500" y="430" width="210" height="56" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="605" y="452" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">GATE G2</text>
  <text x="605" y="471" font-size="11.5" fill="#475569" text-anchor="middle">B2 + 迁移/回滚证据</text>

  <rect x="730" y="430" width="210" height="56" rx="6" fill="#F8FAFC" stroke="#94A3B8" stroke-width="1.2"/>
  <text x="835" y="452" font-size="12" font-weight="700" fill="#334155" text-anchor="middle">GATE G3</text>
  <text x="835" y="471" font-size="11.5" fill="#475569" text-anchor="middle">B3；数值快照 diff=0</text>

  <rect x="960" y="430" width="210" height="56" rx="6" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.2"/>
  <text x="1065" y="452" font-size="12" font-weight="700" fill="#B91C1C" text-anchor="middle">重新授权</text>
  <text x="1065" y="471" font-size="11.5" fill="#B91C1C" text-anchor="middle">不自动进入</text>

  <rect x="40" y="500" width="1130" height="96" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="60" y="524" font-size="14" font-weight="700" fill="#0F172A">批次纪律</text>
  <text x="60" y="548" font-size="12.5" fill="#475569">1. 一批一分支（feature/ux-progression-01-pN），不合并 main　　2. 不跨阶段混提交：P1 不得顺手加存档字段</text>
  <text x="60" y="570" font-size="12.5" fill="#475569">3. 每阶段独立可回滚：P1 回滚=删 UI 代码（零数据影响）；P2 回滚必须带迁移逆操作　　4. 每阶段独立复审</text>
  <text x="60" y="590" font-size="12.5" fill="#475569">5. 证据随批归档：Player run 带 runId / processId / buildSha，断言与 SHA256 一并入库</text>

  <rect x="40" y="616" width="1130" height="72" rx="8" fill="#FEF2F2" stroke="#B91C1C" stroke-width="1.5"/>
  <text x="60" y="640" font-size="13.5" font-weight="700" fill="#B91C1C">跨阶段不变量（任何阶段违反即拒绝交付）</text>
  <text x="60" y="662" font-size="12.5" fill="#991B1B">零经济 · 零随机流 · 零武器伤害/冷却改动 · 零护甲/经验曲线改动 · 零 v9 语义改写（只允许向后兼容新增，且需 D-15）</text>
  <text x="60" y="681" font-size="12" fill="#7F1D1D">失败规则不变：死亡/放弃不因目标系统而加重惩罚</text>
</svg>
